name: CI/CD Pipeline

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "992382472679"
  ECR_REPOSITORY: dating-backend
  EC2_INSTANCE_ID: i-0be079ec9b1bce17d
  APP_DIR: /opt/dating-backend
  IMAGE_NAME: dating-backend

jobs:

  # ============================================================
  # 1. GO TEST
  # ============================================================

  test:
    name: Go Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go tests
        run: |
          go test ./...


  # ============================================================
  # 2. GO LINT
  # ============================================================

  lint:
    name: Go Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest


  # ============================================================
  # 3. SOURCE SECURITY SCAN
  # ============================================================

  security-scan:
    name: Source Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1


  # ============================================================
  # 4. BUILD DOCKER IMAGE
  # ============================================================

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - lint
      - security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Save Docker image
        run: |
          docker save \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -o dating-backend-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: dating-backend-image-${{ github.sha }}
          path: dating-backend-image.tar
          compression-level: 0
          retention-days: 1


  # ============================================================
  # 5. DOCKER IMAGE SECURITY SCAN
  # ============================================================

  image-security-scan:
    name: Docker Image Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: dating-backend-image-${{ github.sha }}

      - name: Load Docker image
        run: |
          docker load \
            -i dating-backend-image.tar

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
          format: table


  # ============================================================
  # 6. PUSH IMAGE TO ECR
  # ============================================================

  push:
    name: Push Image to ECR
    runs-on: ubuntu-latest
    needs: image-security-scan

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: dating-backend-image-${{ github.sha }}

      - name: Load Docker image
        run: |
          docker load \
            -i dating-backend-image.tar

      # ========================================================
      # AWS AUTHENTICATION
      # ========================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::992382472679:role/github-actions-ecr-deploy-role
          role-session-name: github-actions-dating-backend
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      # ========================================================
      # ECR
      # ========================================================

      - name: Login to Amazon ECR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


  # ============================================================
  # 7. DEPLOY TO EC2 VIA SSM
  # ============================================================

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::992382472679:role/github-actions-ecr-deploy-role
          role-session-name: github-actions-dating-backend
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Deploy to EC2 via SSM
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<EOF
          set -euo pipefail

          APP_DIR="/opt/dating-backend"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"

          TMP_DIR="\$(mktemp -d)"
          trap 'rm -rf "\$TMP_DIR"' EXIT

          echo "Downloading source archive for ${GITHUB_SHA}..."
          curl -fL "\$REPO_URL" -o "\$TMP_DIR/source.tar.gz"

          echo "Extracting source..."
          tar -xzf "\$TMP_DIR/source.tar.gz" -C "\$TMP_DIR"

          SOURCE_DIR="\$(find "\$TMP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          echo "Updating deployment files..."

          cp "\$SOURCE_DIR/docker-compose.prod.yml" \
             "\$APP_DIR/docker-compose.prod.yml"

          rm -rf "\$APP_DIR/migrations"
          cp -r "\$SOURCE_DIR/migrations" \
                "\$APP_DIR/migrations"

          rm -rf "\$APP_DIR/nginx"
          cp -r "\$SOURCE_DIR/nginx" \
                "\$APP_DIR/nginx"

          mkdir -p "\$APP_DIR/certbot/www"

          echo "Installing certificate renewal configuration..."

          install -m 750 \
            "\$SOURCE_DIR/ops/certbot/dating-certbot-renew.sh" \
            /usr/local/sbin/dating-certbot-renew.sh

          install -m 644 \
            "\$SOURCE_DIR/ops/certbot/dating-certbot-renew.service" \
            /etc/systemd/system/dating-certbot-renew.service

          install -m 644 \
            "\$SOURCE_DIR/ops/certbot/dating-certbot-renew.timer" \
            /etc/systemd/system/dating-certbot-renew.timer

          systemctl daemon-reload
          systemctl enable --now dating-certbot-renew.timer

          echo "Logging in to ECR..."

          aws ecr get-login-password \
            --region "${AWS_REGION}" \
            | docker login \
                --username AWS \
                --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "Updating IMAGE_TAG..."

          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${GITHUB_SHA}/" \
            "\$APP_DIR/.env.production"

          cd "\$APP_DIR"

          echo "Pulling application image..."

          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.production \
            pull app

          echo "Starting database and Redis..."

          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.production \
            up -d db redis

          echo "Running database migrations..."

          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.production \
            up --force-recreate migrate

          echo "Starting application and Nginx..."

          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.production \
            up -d app nginx

          echo "Waiting for application..."
          sleep 10

          echo "Running application health check..."

          curl -fsS \
            http://127.0.0.1:8080/health

          echo
          echo "Deployment successful."
          EOF
          )

          PARAMETERS_JSON=$(jq -n \
            --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy dating-backend ${GITHUB_SHA}" \
            --parameters "$PARAMETERS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for _ in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "SSM status: ${STATUS}"

            case "${STATUS}" in
              Success)
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output json

                exit 1
                ;;
            esac

            sleep 10
          done

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'Status' \
            --output text)

          if [ "${FINAL_STATUS}" != "Success" ]; then

            echo "Deployment did not complete successfully."

            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query '[Status,StandardOutputContent,StandardErrorContent]' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output json