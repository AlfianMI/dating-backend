name: Build and Deploy

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "992382472679"
  ECR_REPOSITORY: dating-backend
  EC2_INSTANCE_ID: i-0be079ec9b1bce17d
  APP_DIR: /opt/dating-backend

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::992382472679:role/github-actions-ecr-deploy-role
          role-session-name: github-actions-dating-backend
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Login to Amazon ECR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to EC2 via SSM
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<EOF
          set -euo pipefail

          APP_DIR="/opt/dating-backend"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}/archive/${GITHUB_SHA}.tar.gz"

          TMP_DIR="\$(mktemp -d)"
          trap 'rm -rf "\$TMP_DIR"' EXIT

          echo "Downloading source archive for ${GITHUB_SHA}..."
          curl -fL "\$REPO_URL" -o "\$TMP_DIR/source.tar.gz"

          echo "Extracting source..."
          tar -xzf "\$TMP_DIR/source.tar.gz" -C "\$TMP_DIR"

          SOURCE_DIR="\$(find "\$TMP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)"

          echo "Updating deployment files..."
          cp "\$SOURCE_DIR/docker-compose.prod.yml" "\$APP_DIR/docker-compose.prod.yml"

          rm -rf "\$APP_DIR/migrations"
          cp -r "\$SOURCE_DIR/migrations" "\$APP_DIR/migrations"

          echo "Logging in to ECR..."
          aws ecr get-login-password \
            --region "${AWS_REGION}" \
            | docker login \
                --username AWS \
                --password-stdin \
                "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "Updating IMAGE_TAG..."
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${GITHUB_SHA}/" "\$APP_DIR/.env.production"

          cd "\$APP_DIR"

          echo "Pulling application image..."
          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.production \
            pull app

          echo "Starting database and Redis..."
          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.production \
            up -d db redis

          echo "Running database migrations..."
          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.production \
            up --force-recreate migrate

          echo "Starting application..."
          docker compose \
            -f docker-compose.prod.yml \
            --env-file .env.production \
            up -d app

          echo "Waiting for application..."
          sleep 10

          echo "Running health check..."
          curl -fsS http://127.0.0.1:8080/health

          echo "Deployment successful."
          EOF
          )

          PARAMETERS_JSON=$(jq -n \
            --arg script "$DEPLOY_SCRIPT" \
            '{commands: [$script]}')

          COMMAND_ID=$(aws ssm send-command \
            --region "${AWS_REGION}" \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy dating-backend ${GITHUB_SHA}" \
            --parameters "$PARAMETERS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "SSM status: ${STATUS}"

            case "${STATUS}" in
              Success)
                break
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed."

                aws ssm get-command-invocation \
                  --region "${AWS_REGION}" \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query '[Status,StandardOutputContent,StandardErrorContent]' \
                  --output json

                exit 1
                ;;
            esac

            sleep 10
          done

          FINAL_STATUS=$(aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query 'Status' \
            --output text)

          if [ "${FINAL_STATUS}" != "Success" ]; then
            echo "Deployment did not complete successfully."

            aws ssm get-command-invocation \
              --region "${AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query '[Status,StandardOutputContent,StandardErrorContent]' \
              --output json

            exit 1
          fi

          aws ssm get-command-invocation \
            --region "${AWS_REGION}" \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output json