services:
  db:
    image: postgis/postgis:15-3.3
    container_name: dating_db_prod
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dating_redis_prod
    env_file:
      - .env.production
    command: >
      sh -c 'redis-server --requirepass "$$REDIS_PASSWORD"'
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.0
    container_name: dating_migrate_prod
    env_file:
      - .env.production
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        migrate -path=/migrations \
          -database="postgres://$${DB_USER}:$${DB_PASSWORD}@db:5432/$${DB_NAME}?sslmode=disable" \
          up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    container_name: dating_backend_prod
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env.production
    environment:
      DB_HOST: db
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./firebase-service-account-prod.json:/app/firebase-service-account-prod.json:ro
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.29-alpine
    container_name: dating_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      app:
        condition: service_started
    restart: always

volumes:
  postgres_data_prod: